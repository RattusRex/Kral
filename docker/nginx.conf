# nginx site config for the frontend container.
#
# Responsibilities:
#   1. Serve the static React/Vite bundle from /usr/share/nginx/html.
#   2. Reverse-proxy /api/* to the backend service so the browser only ever
#      talks to a single origin (no CORS preflight, no API base config in the
#      bundle — the default "/api" prefix just works).
#   3. SPA fallback: unknown paths return index.html so client-side routing
#      (react-router) works on hard refresh / deep links.

upstream backend {
    # "backend" is the docker-compose service name on the shared network.
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=auth_api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for inventory notes / chat payloads.
    client_max_body_size 10m;
    limit_req_status 429;

    # Extra proxy-level abuse control for the public authentication endpoints.
    # FastAPI also enforces per-subject/IP lockouts, but this protects the
    # backend from high-rate bursts before Python request handling starts.
    location = /api/login {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    location = /api/users {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # API requests -> FastAPI. The /api prefix is preserved upstream because
    # proxy_pass has no path component.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow WebSocket upgrades in case future endpoints need them.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Long-cache hashed static assets emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
